<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корень — общение</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d10;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: #12161c;
      border-bottom: 1px solid #292f38;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
    }

    .logo span {
      color: #4f8cff;
    }

    .login {
      background: #4f8cff;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 35px 18px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #4f8cff;
    }

    .hero p {
      color: #aeb6c2;
      font-size: 18px;
      line-height: 1.6;
    }

    .chat-box {
      background: #12161c;
      border: 1px solid #292f38;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 20px;
    }

    .chat-title {
      padding: 20px;
      border-bottom: 1px solid #292f38;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      padding: 20px;
      min-height: 250px;
    }

    .message {
      background: #1b2129;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      max-width: 80%;
    }

    .message strong {
      color: #4f8cff;
      display: block;
      margin-bottom: 5px;
    }

    .message p {
      color: #d9dee6;
      line-height: 1.4;
    }

    .message.you {
      margin-left: auto;
      background: #203b69;
    }

    .message.you strong {
      color: #ffffff;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #292f38;
    }

    .input-area input {
      flex: 1;
      background: #0b0d10;
      border: 1px solid #343b46;
      color: white;
      padding: 13px;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .send {
      background: #4f8cff;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    footer {
      text-align: center;
      color: #68717e;
      padding: 35px 15px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 38px;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🌱 <span>Корень</span></div>
    <button class="login" onclick="alert('Регистрация появится на следующем этапе')">
      Войти
    </button>
  </header>

  <main>

    <section class="hero">
      <h1>Добро пожаловать в <span>Корень</span></h1>
      <p>
        Место для открытого общения, новых знакомств
        и интересных разговоров.
      </p>
    </section>

    <section class="chat-box">

      <div class="chat-title">
        💬 Общая беседа
      </div>

      <div class="messages" id="messages">

        <div class="message">
          <strong>Корень</strong>
          <p>Добро пожаловать! Начните разговор.</p>
        </div>

        <div class="message you">
          <strong>Вы</strong>
          <p>Привет, Корень! 👋</p>
        </div>

      </div>

      <div class="input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="Напишите сообщение..."
        >
        <button class="send" onclick="sendMessage()">
          Отправить
        </button>
      </div>

    </section>

  </main>

  <footer>
    © 2026 Корень — открытое общение
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      const message = document.createElement("div");
      message.className = "message you";

      message.innerHTML = `
        <strong>Вы</strong>
        <p></p>
      `;

      message.querySelector("p").textContent = text;

      messages.appendChild(message);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("messageInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
